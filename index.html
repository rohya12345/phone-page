<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MANAK Phone Capture</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a3d">
<style>
  :root { color-scheme: light dark; --bg:#f4f7fb; --card:#fff; --ink:#1f2a3d; --muted:#5b6a7d; --line:#d6dee9; --ok:#2e7d32; --err:#c62828; --warn:#a07d1e; --acc:#1f2a3d; --hi:#fff3c4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12161d; --card:#1b212b; --ink:#e6ebf2; --muted:#9aa7b8; --line:#2c3543; --acc:#3d6fd1; --hi:#4a3d12; } }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  #bar { position:sticky; top:0; z-index:10; padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top)); font-weight:600; font-size:14px; background:#fff8e6; color:var(--warn); }
  #bar.ok { background:#e8f5e9; color:var(--ok); } #bar.err { background:#fdecea; color:var(--err); }
  main { max-width:560px; margin:0 auto; padding:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:12px; }
  h2 { margin:0 0 8px; font-size:16px; }
  select { width:100%; padding:11px; font-size:16px; border:1px solid var(--line); border-radius:10px; background:transparent; color:inherit; }
  button { padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:inherit; font-size:15px; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; }
  .hide { display:none !important; }
  .muted { color:var(--muted); font-size:13px; }

  /* lot + progress */
  .prog { height:10px; background:rgba(127,127,127,.2); border-radius:6px; overflow:hidden; margin-top:10px; }
  #progBar { height:100%; width:0; background:var(--ok); transition:width .3s; }
  #progTxt { font-size:13px; color:var(--muted); margin-top:5px; }

  /* what to shoot next */
  .target { background:var(--hi); border-color:#e6c75a; text-align:center; }
  .target.done { background:#e8f5e9; border-color:#9ccc9f; color:#1b5e20; }
  #tKind { font-size:26px; font-weight:800; letter-spacing:.3px; }
  #tRow { font-size:15px; margin-top:2px; }
  #tHuid { font:700 28px/1.2 ui-monospace,Consolas,monospace; letter-spacing:2px; margin-top:4px; }

  /* camera */
  #camBox { position:relative; background:#000; border-radius:12px; overflow:hidden; margin:0 auto; width:100%; height:260px; display:flex; align-items:center; justify-content:center; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px; }
  .chips .lab { font-size:12px; color:var(--muted); width:42px; }
  .chips button { padding:6px 11px; font-size:13px; border-radius:16px; }
  .chips button.on { background:var(--acc); color:#fff; border-color:var(--acc); }
  #noHuidNote { font-size:13px; color:var(--warn); text-align:center; margin-top:8px; }
  #video { width:100%; height:100%; object-fit:cover; transform-origin:center; will-change:transform; }
  #camBox { touch-action:none; }
  .zoomrow { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .zoomrow input[type=range] { flex:1; accent-color:var(--acc); height:28px; }
  .zoomrow .zb { width:40px; height:40px; border-radius:50%; padding:0; font-size:20px; }
  #zVal { min-width:48px; text-align:right; font-weight:700; font-size:14px; }
  #zoomChips { justify-content:center; margin:8px 0 0; }
  #camPlaceholder { position:absolute; color:#9aa7b8; font-size:14px; text-align:center; padding:12px; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.on { animation:fl .25s; } @keyframes fl { 0%{opacity:.85} 100%{opacity:0} }
  .camrow { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:12px; }
  .shutter { width:78px; height:78px; border-radius:50%; border:5px solid var(--acc); background:#fff; color:var(--acc); font-size:0; padding:0; box-shadow:0 0 0 3px var(--card) inset; }
  .shutter:active { transform:scale(.94); }
  .round { width:50px; height:50px; border-radius:50%; padding:0; font-size:20px; }
  .alt { display:flex; gap:8px; margin-top:12px; } .alt button { flex:1; font-size:14px; }
  #camMsg { font-size:13px; color:var(--muted); margin-top:8px; min-height:16px; }

  /* slots */
  .slots { display:flex; gap:10px; }
  .slot { flex:1; border:2px dashed var(--line); border-radius:12px; padding:8px; text-align:center; cursor:pointer; }
  .slot.sel { border-color:var(--acc); border-style:solid; box-shadow:0 0 0 2px var(--acc) inset; }
  .slot.done { border-color:var(--ok); border-style:solid; }
  .slot.fail { border-color:var(--err); border-style:solid; }
  .slot .t { font-weight:700; font-size:14px; }
  .slot .thumb { height:70px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:12px; overflow:hidden; border-radius:8px; background:rgba(127,127,127,.1); margin:6px 0; }
  .slot .thumb img { max-width:100%; max-height:70px; }
  .slot .st { font-size:12px; min-height:16px; }

  .nav { display:flex; gap:8px; margin-top:12px; } .nav select { flex:1; } .nav button { width:48px; font-size:20px; }
  #sendLine { font-size:13px; margin-top:10px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px; }
  label.chk { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--muted); margin-top:10px; }
  #msg { font-size:13px; color:var(--err); min-height:16px; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="bar">Starting…</div>
<main>
  <div class="card" id="pairCard">
    <h2>Pair with your PC</h2>
    <p id="pairHelp" class="muted" style="margin:0;">Scan the QR code shown in the extension's “Capture from phone” window.</p>
  </div>

  <div id="mainCard" class="hide">
    <div class="card">
      <select id="lotSel" aria-label="Lot (job card)"></select>
      <div class="prog"><div id="progBar"></div></div>
      <div id="progTxt"></div>
    </div>

    <div class="card target" id="targetCard">
      <div id="tKind">—</div>
      <div id="tRow"></div>
      <div id="tHuid"></div>
    </div>

    <div class="card">
      <div class="chips" id="ratioChips" role="group" aria-label="Photo shape">
        <span class="lab">Shape</span>
        <button data-r="1:1">1:1</button><button data-r="4:3">4:3</button><button data-r="3:4">3:4</button><button data-r="3:2">3:2</button><button data-r="16:9">16:9</button><button data-r="full">Full</button>
      </div>
      <div class="chips" id="sizeChips" role="group" aria-label="Photo size">
        <span class="lab">Size</span>
        <button data-s="actual">Actual size</button><button data-s="reduced">Reduced</button>
      </div>
      <div id="camBox">
        <video id="video" playsinline muted autoplay></video>
        <div id="camPlaceholder">Camera is off</div>
        <div id="flash"></div>
      </div>
      <div class="zoomrow hide" id="zoomRow">
        <button class="zb" id="zOut" aria-label="Zoom out">−</button>
        <input type="range" id="zoom" min="1" max="4" step="0.1" value="1" aria-label="Zoom">
        <button class="zb" id="zIn" aria-label="Zoom in">＋</button>
        <span id="zVal">1.0×</span>
      </div>
      <div class="chips hide" id="zoomChips" role="group" aria-label="Zoom presets"></div>
      <div class="camrow">
        <button class="round" id="btnFlip" aria-label="Switch camera" title="Switch camera">⟲</button>
        <button class="shutter" id="shutter" aria-label="Take photo">●</button>
        <button class="round" id="btnTorch" aria-label="Torch" title="Torch" hidden>🔦</button>
        <button class="round" id="btnCam" aria-label="Camera on/off" title="Camera on/off">📷</button>
      </div>
      <div class="alt">
        <button id="btnApp">📱 Use camera app</button>
        <button id="btnGal">🖼 Gallery</button>
      </div>
      <div id="camMsg"></div>
    </div>

    <div class="card">
      <div class="slots">
        <div class="slot" id="slotA"><div class="t">🖼 Article</div><div class="thumb" id="thA"></div><div class="st" id="stA"></div></div>
        <div class="slot" id="slotH"><div class="t">🔖 HUID</div><div class="thumb" id="thH"></div><div class="st" id="stH"></div></div>
      </div>
      <div id="noHuidNote" class="hide">ℹ No HUID for this row — only the Article photo is needed.</div>
      <div class="nav">
        <button id="prev" aria-label="Previous row">‹</button>
        <select id="rowSel" aria-label="Row"></select>
        <button id="next" aria-label="Next row">›</button>
      </div>
      <div class="nav" style="margin-top:8px;"><button id="btnMissing" style="flex:1;width:auto;font-size:15px;">⏭ Jump to next missing photo</button></div>
      <div id="sendLine"><span id="sendTxt"></span><button id="btnRetry" class="hide" style="padding:6px 10px;font-size:13px;">↻ Retry failed</button></div>
      <label class="chk"><input type="checkbox" id="auto" checked> Auto-advance after each photo</label>
    </div>
    <div id="msg"></div>
  </div>
</main>

<input type="file" id="fApp" accept="image/*" capture="environment">
<input type="file" id="fGal" accept="image/*">
<canvas id="cv" class="hide"></canvas>

<script>
(() => {
  // Relay = Edge Function "mapu-api" in your Supabase project (private storage, per-session secrets).
  const API = 'https://fhtpagfnshficnwkuqpm.supabase.co/functions/v1/mapu-api';
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const KIND_LABEL = { article: '🖼 ARTICLE photo', huid: '🔖 HUID photo' };

  let sid = '', tok = '', rows = [], lot = '', cursor = 0, target = null, started = false, pollTimer = null;
  const S = {};                         // "job|sno|kind" -> { st:'queued'|'sending'|'sent'|'fail', blob, thumb, err }
  const keyOf = (job, sno, kind) => job + '|' + sno + '|' + kind;
  const sendQ = []; let active = 0;

  function bar(t, cls) { const b = $('bar'); b.textContent = t; b.className = cls || ''; }
  function toast(t) { $('msg').textContent = t || ''; }

  // ---------- API ----------
  async function post(body, ms) {
    const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms || 20000);
    try {
      const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ac.signal });
      return await r.json();
    } finally { clearTimeout(t); }
  }

  // ---------- start ----------
  function parseHash() {
    const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
    const i = h.indexOf('.');
    return i > 0 ? { sid: h.slice(0, i), tok: h.slice(i + 1) } : { sid: '', tok: '' };
  }
  async function init() {
    ({ sid, tok } = parseHash());
    if (!sid || !tok) {
      bar('Not paired yet', 'err');
      $('pairHelp').textContent = 'Open the extension on your PC → “📱 Capture from phone” and scan the QR code with this phone’s camera.';
      return;
    }
    lot = new URLSearchParams(location.search).get('job') || '';       // Job No. comes from the URL
    bar('Connecting…');
    await refresh(true);
  }
  async function refresh(first) {
    try {
      const r = await post({ action: 'phone_init', session_id: sid, phone_token: tok }, 15000);
      if (!r.ok) { bar((r.error || 'Session invalid') + '. Scan the QR code again.', 'err'); clearInterval(pollTimer); started = false; return; }
      bar('✅ Connected', 'ok');
      $('pairCard').classList.add('hide'); $('mainCard').classList.remove('hide');
      rows = (r.rows || []).map(x => ({ job: x.job || '', sno: x.sno, tag: x.tag || '', huid: x.huid || '', item: x.item || '', a: !!x.a, h: !!x.h, nh: !!x.nh }));
      const jobs = lots();
      if (!jobs.includes(lot)) lot = jobs[0] || '';
      if (!started) {
        started = true;
        pollTimer = setInterval(() => refresh(false), 8000);
        if (localStorage.getItem('mapu_cam') !== '0') startCam();      // auto-start the live camera
      }
      if (first || !target) { cursor = 0; target = findNext(0); }
      renderAll();
    } catch (e) {
      bar('Connection problem — retrying…', 'err');
      if (!started && first) setTimeout(() => refresh(true), 4000);
    }
  }

  // ---------- lots / rows ----------
  const lots = () => [...new Set(rows.map(r => r.job))];
  const lotRows = () => rows.filter(r => r.job === lot);
  const stOf = (r, kind) => (S[keyOf(r.job, r.sno, kind)] || {}).st;
  const rowDone = r => has(r, 'article') && (r.nh || has(r, 'huid'));    // Article-only rows (no HUID) need just the Article
  const has = (r, kind) => (kind === 'huid' ? r.h : r.a) || ['queued', 'sending', 'sent'].includes(stOf(r, kind));

  function findNext(from) {                       // first missing photo, Article before HUID, wrapping around the lot
    const lr = lotRows(); if (!lr.length) return null;
    for (let n = 0; n < lr.length; n++) {
      const i = (from + n) % lr.length, r = lr[i];
      if (!has(r, 'article')) return { job: r.job, sno: r.sno, kind: 'article' };
      if (!r.nh && !has(r, 'huid')) return { job: r.job, sno: r.sno, kind: 'huid' };
    }
    return null;
  }
  function setTarget(t) {
    target = t;
    if (t) { const i = lotRows().findIndex(r => r.sno === t.sno); if (i >= 0) cursor = i; }
    renderAll();
  }
  const rowOfTarget = () => target && rows.find(r => r.job === target.job && r.sno === target.sno);

  // ---------- render ----------
  function renderAll() { renderLots(); renderTarget(); renderSlots(); renderRowSel(); renderSend(); }

  function renderLots() {
    const sel = $('lotSel'), jobs = lots();
    sel.innerHTML = '';
    for (const j of jobs) {
      const lr = rows.filter(r => r.job === j);
      const done = lr.filter(rowDone).length;
      const o = document.createElement('option');
      o.value = j; o.textContent = (j ? 'Job ' + j : '(no job no.)') + ' — ' + done + '/' + lr.length + ' rows done';
      sel.appendChild(o);
    }
    sel.value = lot;
    document.title = (lot ? 'Job ' + lot + ' — ' : '') + 'MANAK Phone Capture';
    const lr = lotRows(), total = lr.reduce((a, r) => a + (r.nh ? 1 : 2), 0);
    const n = lr.reduce((a, r) => a + (has(r, 'article') ? 1 : 0) + (!r.nh && has(r, 'huid') ? 1 : 0), 0);
    $('progBar').style.width = total ? (100 * n / total) + '%' : '0%';
    $('progTxt').textContent = total ? n + ' / ' + total + ' photos captured in this lot' : 'No rows in this lot yet — Scan Table & Match on the PC, then “New QR”.';
  }
  function renderTarget() {
    const card = $('targetCard'), r = rowOfTarget();
    if (!target || !r) {
      card.classList.add('done');
      $('tKind').textContent = lotRows().length ? '🎉 Lot complete' : '—';
      $('tRow').textContent = lotRows().length ? 'All photos for this lot are captured.' : '';
      $('tHuid').textContent = '';
      const other = lots().find(j => j !== lot && rows.some(r2 => r2.job === j && !rowDone(r2)));
      if (other !== undefined && lotRows().length) $('tRow').innerHTML = 'All photos for this lot are captured. Next lot: <b>' + esc(other ? 'Job ' + other : '(no job no.)') + '</b> — pick it above.';
      return;
    }
    card.classList.remove('done');
    $('tKind').textContent = KIND_LABEL[target.kind];
    $('tRow').textContent = 'S No. ' + r.sno + (r.tag ? ' · Tag ' + r.tag : '') + (r.item ? ' · ' + r.item : '');
    $('tHuid').textContent = r.nh ? 'No HUID — Article only' : (r.huid || '');
  }
  const fmtSize = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.round(n / 1024) + ' KB';
  function renderSlots() {
    const r = rowOfTarget() || lotRows()[cursor];
    for (const [kind, L] of [['article', 'A'], ['huid', 'H']]) {
      const slot = $('slot' + L), th = $('th' + L), st = $('st' + L);
      if (!r || (kind === 'huid' && r.nh)) { slot.className = 'slot'; th.textContent = ''; st.textContent = ''; continue; }
      const e = S[keyOf(r.job, r.sno, kind)], flag = kind === 'huid' ? r.h : r.a;
      slot.className = 'slot' + (target && target.sno === r.sno && target.kind === kind ? ' sel' : '') + (e && e.st === 'fail' ? ' fail' : (flag || (e && e.st === 'sent')) ? ' done' : '');
      th.innerHTML = e && e.thumb ? '<img src="' + e.thumb + '">' : (flag ? '✓ on PC' : 'no photo');
      const sz = e && e.blob ? ' · ' + fmtSize(e.blob.size) : '';
      st.textContent = !e ? (flag ? 'Saved ✓' : '') : e.st === 'queued' ? 'Waiting…' + sz : e.st === 'sending' ? 'Sending…' + sz : e.st === 'sent' ? 'Sent ✓' + sz : 'Failed ✗';
    }    $('slotH').classList.toggle('hide', !!(r && r.nh));            // no HUID -> hide the HUID slot (after className resets above)
    $('noHuidNote').classList.toggle('hide', !(r && r.nh));
  }
  function renderRowSel() {
    const sel = $('rowSel'), lr = lotRows();
    sel.innerHTML = '';
    lr.forEach((r, i) => {
      const o = document.createElement('option');
      o.value = i;
      o.textContent = 'S No. ' + r.sno + (r.huid ? ' · ' + r.huid : '') + '  [' + (has(r, 'article') ? 'A✓' : 'A–') + ' ' + (r.nh ? 'no HUID' : has(r, 'huid') ? 'H✓' : 'H–') + ']';
      sel.appendChild(o);
    });
    sel.value = Math.min(cursor, Math.max(0, lr.length - 1));
  }
  function renderSend() {
    const v = Object.values(S);
    const sending = v.filter(e => e.st === 'queued' || e.st === 'sending').length, failed = v.filter(e => e.st === 'fail').length;
    $('sendTxt').textContent = sending ? '⬆ Sending ' + sending + '…' : failed ? '' : (v.length ? '✓ All sent' : '');
    $('sendTxt').style.color = failed ? 'var(--err)' : '';
    if (failed) $('sendTxt').textContent = '✗ ' + failed + ' not sent' + (sending ? ' · ⬆ ' + sending + ' sending' : '');
    $('btnRetry').classList.toggle('hide', !failed);
  }

  // ---------- navigation ----------
  $('lotSel').onchange = e => {
    lot = e.target.value; cursor = 0; target = findNext(0);
    try { const u = new URL(location.href); if (lot) u.searchParams.set('job', lot); else u.searchParams.delete('job'); history.replaceState(null, '', u); } catch (x) {}
    renderAll();
  };
  const goRow = n => { const lr = lotRows(); if (!lr.length) return; cursor = (n + lr.length) % lr.length; const r = lr[cursor];
    setTarget(!has(r, 'article') ? { job: r.job, sno: r.sno, kind: 'article' } : (!r.nh && !has(r, 'huid')) ? { job: r.job, sno: r.sno, kind: 'huid' } : { job: r.job, sno: r.sno, kind: 'article' }); };
  $('prev').onclick = () => goRow(cursor - 1);
  $('next').onclick = () => goRow(cursor + 1);
  $('rowSel').onchange = e => goRow(Number(e.target.value));
  $('btnMissing').onclick = () => { const t = findNext(cursor); if (t) setTarget(t); else toast('Nothing missing in this lot.'); };
  $('slotA').onclick = () => pickSlot('article');
  $('slotH').onclick = () => pickSlot('huid');
  function pickSlot(kind) { const r = rowOfTarget() || lotRows()[cursor]; if (r && !(kind === 'huid' && r.nh)) setTarget({ job: r.job, sno: r.sno, kind }); }

  // ---------- live camera ----------
  let stream = null, facing = 'environment', camWanted = false, wake = null;
  const video = $('video');

  // Shape (default 1:1) and size (default actual) — remembered on this phone.
  const RATIOS = { '1:1': 1, '4:3': 4 / 3, '3:4': 3 / 4, '3:2': 3 / 2, '16:9': 16 / 9, 'full': 0 };
  let ratio = localStorage.getItem('mapu_ratio'); if (!(ratio in RATIOS)) ratio = '1:1';
  let sizeMode = localStorage.getItem('mapu_size') === 'reduced' ? 'reduced' : 'actual';
  function renderChips() {
    document.querySelectorAll('#ratioChips button').forEach(b => b.classList.toggle('on', b.dataset.r === ratio));
    document.querySelectorAll('#sizeChips button').forEach(b => b.classList.toggle('on', b.dataset.s === sizeMode));
  }
  function layoutCam() {                           // viewfinder shows EXACTLY the area that will be captured
    const box = $('camBox'), pw = Math.max(200, Math.min(box.parentElement.clientWidth - 24, 560));
    const r = RATIOS[ratio] || ((video.videoWidth && video.videoHeight) ? video.videoWidth / video.videoHeight : 4 / 3);
    const maxH = Math.max(220, window.innerHeight * 0.55);
    let w = pw, hh = w / r;
    if (hh > maxH) { hh = maxH; w = hh * r; }
    box.style.width = Math.round(w) + 'px'; box.style.height = Math.round(hh) + 'px';
  }
  function cropRect(w0, h0) {                      // centre crop to the chosen shape (Full = no crop)
    const r = RATIOS[ratio];
    if (!r) return { sx: 0, sy: 0, sw: w0, sh: h0 };
    if (w0 / h0 > r) { const sw = Math.round(h0 * r); return { sx: Math.round((w0 - sw) / 2), sy: 0, sw, sh: h0 }; }
    const sh = Math.round(w0 / r); return { sx: 0, sy: Math.round((h0 - sh) / 2), sw: w0, sh };
  }
  document.querySelectorAll('#ratioChips button').forEach(b => b.onclick = () => { ratio = b.dataset.r; localStorage.setItem('mapu_ratio', ratio); renderChips(); layoutCam(); });
  document.querySelectorAll('#sizeChips button').forEach(b => b.onclick = () => { sizeMode = b.dataset.s; localStorage.setItem('mapu_size', sizeMode); renderChips(); if (stream) startCam(); });
  window.addEventListener('resize', layoutCam);
  video.addEventListener('loadedmetadata', layoutCam);

  // ---------- zoom (hardware zoom when the phone offers it, otherwise digital) ----------
  let zoom = 1, zMin = 1, zMax = 4, zStep = 0.1, hwZoom = false;
  const clampZ = z => Math.min(zMax, Math.max(zMin, z));
  const fmtZ = z => (Math.round(z * 10) / 10).toFixed(1) + '×';
  function setZoomRange(caps) {
    const zc = caps && caps.zoom;
    if (zc && zc.max > zc.min) { hwZoom = true; zMin = zc.min; zMax = Math.min(zc.max, 10); zStep = zc.step || 0.1; }
    else { hwZoom = false; zMin = 1; zMax = 4; zStep = 0.1; }
    const sl = $('zoom'); sl.min = zMin; sl.max = zMax; sl.step = zStep;
    const chips = $('zoomChips'); chips.innerHTML = '';
    [1, 2, 3, 5].filter(p => p >= zMin && p <= zMax).forEach(p => {
      const b = document.createElement('button'); b.textContent = p + '×'; b.dataset.z = p;
      b.onclick = () => setZoom(p); chips.appendChild(b);
    });
    $('zoomRow').classList.remove('hide'); chips.classList.toggle('hide', !chips.children.length);
    setZoom(zoom);                                   // keep the previous zoom when the camera restarts / flips
  }
  async function setZoom(z) {
    zoom = clampZ(Number(z) || 1);
    $('zoom').value = zoom; $('zVal').textContent = fmtZ(zoom);
    document.querySelectorAll('#zoomChips button').forEach(b => b.classList.toggle('on', Math.abs(Number(b.dataset.z) - zoom) < 0.05));
    if (hwZoom && stream) {
      try { await stream.getVideoTracks()[0].applyConstraints({ advanced: [{ zoom }] }); video.style.transform = 'none'; return; }
      catch (e) { hwZoom = false; }                  // hardware zoom refused -> fall back to digital
    }
    video.style.transform = zoom > 1 ? 'scale(' + zoom + ')' : 'none';
  }
  $('zoom').oninput = e => setZoom(e.target.value);
  $('zIn').onclick = () => setZoom(zoom + Math.max(zStep, 0.5));
  $('zOut').onclick = () => setZoom(zoom - Math.max(zStep, 0.5));
  // pinch to zoom on the viewfinder
  const pts = new Map(); let pinchD = 0, pinchZ = 1;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  const camBoxEl = $('camBox');
  camBoxEl.addEventListener('pointerdown', e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { pinchD = dist() || 1; pinchZ = zoom; } });
  camBoxEl.addEventListener('pointermove', e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) setZoom(pinchZ * dist() / pinchD); });
  for (const t of ['pointerup', 'pointercancel', 'pointerleave']) camBoxEl.addEventListener(t, e => pts.delete(e.pointerId));
  function camMsg(t) { $('camMsg').textContent = t || ''; }
  async function startCam() {
    if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) { camMsg('Live camera not available here — use “Use camera app”.'); return false; }
    stopCam(true);
    try {
      const hi = sizeMode === 'actual';                               // actual size -> ask the camera for its highest resolution
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: facing }, width: { ideal: hi ? 4096 : 1920 }, height: { ideal: hi ? 3072 : 1080 } }, audio: false });
      video.srcObject = stream; await video.play();
      camWanted = true; localStorage.setItem('mapu_cam', '1');
      $('camPlaceholder').classList.add('hide'); camMsg('');
      const caps = (stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getCapabilities) ? stream.getVideoTracks()[0].getCapabilities() : {};
      $('btnTorch').hidden = !caps.torch;
      setZoomRange(caps);
      try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
      return true;
    } catch (e) {
      stream = null; $('camPlaceholder').classList.remove('hide');
      camMsg('Camera unavailable (' + (e.name || 'error') + '). Allow camera access, or use “Use camera app”.');
      return false;
    }
  }
  function stopCam(silent) {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    video.srcObject = null; $('camPlaceholder').classList.remove('hide');
    $('zoomRow').classList.add('hide'); $('zoomChips').classList.add('hide'); video.style.transform = 'none';
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
    if (!silent) { camWanted = false; localStorage.setItem('mapu_cam', '0'); }
  }
  $('btnCam').onclick = () => { stream ? stopCam(false) : startCam(); };
  $('btnFlip').onclick = () => { facing = facing === 'environment' ? 'user' : 'environment'; if (stream) startCam(); };
  $('btnTorch').onclick = async () => {
    try { const t = stream.getVideoTracks()[0]; const on = !(t.__torch); await t.applyConstraints({ advanced: [{ torch: on }] }); t.__torch = on; } catch (e) { camMsg('Torch not supported.'); }
  };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (stream) stopCam(true); }
    else if (camWanted && !stream) startCam();
  });

  function snap() {
    const w0 = video.videoWidth, h0 = video.videoHeight;
    if (!w0 || !h0) { toast('Camera not ready yet.'); return; }
    let c = cropRect(w0, h0);
    if (!hwZoom && zoom > 1) {                       // digital zoom: capture exactly the centre area shown on screen
      const nw = Math.round(c.sw / zoom), nh = Math.round(c.sh / zoom);
      c = { sx: c.sx + Math.round((c.sw - nw) / 2), sy: c.sy + Math.round((c.sh - nh) / 2), sw: nw, sh: nh };
    }
    const cv = $('cv');
    const sc = sizeMode === 'actual' ? 1 : Math.min(1, 1600 / Math.max(c.sw, c.sh));
    cv.width = Math.round(c.sw * sc); cv.height = Math.round(c.sh * sc);
    cv.getContext('2d').drawImage(video, c.sx, c.sy, c.sw, c.sh, 0, 0, cv.width, cv.height);
    cv.toBlob(b => { if (b) onCapture(b); else toast('Could not capture.'); }, 'image/jpeg', sizeMode === 'actual' ? 0.92 : 0.85);
  }
  function feedback() { const f = $('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); try { navigator.vibrate && navigator.vibrate(25); } catch (e) {} }

  $('shutter').onclick = () => {
    if (!target) { toast(lotRows().length ? 'Lot complete — pick another lot or row.' : 'No rows yet.'); return; }
    toast('');
    if (stream) { feedback(); snap(); } else $('fApp').click();     // no live camera -> phone's camera app
  };
  $('btnApp').onclick = () => { if (!target) { toast('Nothing to capture.'); return; } $('fApp').value = ''; $('fApp').click(); };
  $('btnGal').onclick = () => { if (!target) { toast('Nothing to capture.'); return; } $('fGal').value = ''; $('fGal').click(); };
  for (const id of ['fApp', 'fGal']) $(id).onchange = async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { onCapture(await processFile(f)); } catch (x) { toast('Error: ' + x.message); }
  };

  // Picked file (camera app / gallery): crop to the chosen shape; keep ACTUAL pixels (or ≤1600 px in Reduced mode).
  // Full shape + actual size -> the original JPEG bytes are sent untouched.
  async function processFile(file) {
    if (!RATIOS[ratio] && sizeMode === 'actual' && file.type === 'image/jpeg') return file;
    let bmp;
    try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch (e) { bmp = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = u; }); }
    const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
    const c = cropRect(w0, h0), cv = $('cv');
    const sc = sizeMode === 'actual' ? 1 : Math.min(1, 1600 / Math.max(c.sw, c.sh));
    cv.width = Math.round(c.sw * sc); cv.height = Math.round(c.sh * sc);
    cv.getContext('2d').drawImage(bmp, c.sx, c.sy, c.sw, c.sh, 0, 0, cv.width, cv.height);
    return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', sizeMode === 'actual' ? 0.92 : 0.85));
  }

  // Safety net for very large photos: re-encode smaller (long side 2400 px) if the relay refuses the size.
  async function reduceBlob(blob) {
    const bmp = await createImageBitmap(blob), cv = $('cv');
    const sc = Math.min(1, 2400 / Math.max(bmp.width, bmp.height));
    cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    return new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('encode failed')), 'image/jpeg', 0.9));
  }

  // ---------- capture → queue → send ----------
  function onCapture(blob) {
    const t = target; if (!t) return;
    const k = keyOf(t.job, t.sno, t.kind);
    if (S[k] && S[k].thumb) URL.revokeObjectURL(S[k].thumb);
    S[k] = { st: 'queued', blob, thumb: URL.createObjectURL(blob), err: '' };
    sendQ.push(k);
    if ($('auto').checked) target = findNext(cursor); else target = t;     // Article → HUID → next row …
    if (target) { const i = lotRows().findIndex(r => r.sno === target.sno); if (i >= 0) cursor = i; }
    renderAll(); pump();
  }
  function pump() {
    while (active < 2 && sendQ.length) {
      const k = sendQ.shift(), e = S[k];
      if (!e || e.st === 'sent' || e.st === 'sending') continue;
      active++; send(k).finally(() => { active--; pump(); });
    }
    renderAll();
  }
  async function send(k) {
    const e = S[k], [job, sno, kind] = k.split('|');
    e.st = 'sending'; renderSlots(); renderSend();
    for (let attempt = 1; attempt <= 3; attempt++) {
      const ac = new AbortController(), t = setTimeout(() => ac.abort(), 60000);
      try {
        const fd = new FormData();
        fd.append('session_id', sid); fd.append('phone_token', tok);
        fd.append('job', job); fd.append('sno', sno); fd.append('kind', kind);
        fd.append('file', e.blob, kind + '_' + sno + '.jpg');
        const resp = await fetch(API, { method: 'POST', body: fd, signal: ac.signal });
        const j = await resp.json();
        if (j.ok) {
          e.st = 'sent'; e.err = '';
          const row = rows.find(x => x.job === job && x.sno === sno);
          if (row) { if (kind === 'huid') row.h = true; else row.a = true; }
          return;
        }
        e.err = j.error || ('HTTP ' + resp.status);
        if ((resp.status === 413 || /size/i.test(e.err)) && !e.reduced) {                 // too big -> shrink once and retry
          try { e.blob = await reduceBlob(e.blob); e.reduced = true; e.err = ''; attempt--; continue; } catch (x) {}
        }
        if (resp.status === 401 || resp.status === 400 || resp.status === 413) break;     // retrying will not help
      } catch (err) {
        e.err = err.name === 'AbortError' ? 'timeout' : (err.message || 'network');
        if (!e.reduced && e.blob.size > 4e6) { try { e.blob = await reduceBlob(e.blob); e.reduced = true; attempt--; continue; } catch (x) {} }   // huge upload dropped -> try smaller
      }
      finally { clearTimeout(t); }
      if (attempt < 3) await sleep(1500 * attempt);
    }
    e.st = 'fail';
    toast('Not sent: ' + e.err + ' — tap “Retry failed”.');
  }
  $('btnRetry').onclick = () => {
    toast('');
    for (const [k, e] of Object.entries(S)) if (e.st === 'fail') { e.st = 'queued'; sendQ.push(k); }
    pump();
  };
  window.addEventListener('online', () => $('btnRetry').click());

  renderChips(); layoutCam();
  init();
})();
</script>
</body>
</html>
